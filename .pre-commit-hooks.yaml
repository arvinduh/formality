# Hooks for the pre-commit framework (https://pre-commit.com).

- id: fml-fmt
  name: fml fmt (staged)
  description: Formats the staged files with fml
  entry: fml fmt --staged
  language: system
  pass_filenames: false

- id: fml-lint
  name: fml lint (staged)
  description: Lints the staged files with fml
  entry: fml lint --staged
  language: system
  pass_filenames: false
