# Pins the Rust toolchain for local dev (rustup reads this automatically)
# and CI (see .github/workflows/ci.yml, which pins the same version
# explicitly since the dtolnay/rust-toolchain action does not read this
# file). Bump deliberately, in the same change as the CI pin below.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
