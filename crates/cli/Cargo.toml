[package]
name = "fml-cli"
description = "The fml command: formats and lints every file in a repo"
version = "0.5.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axoupdater = { version = "0.10.2", default-features = false, features = [
  "blocking",
  "github_releases",
] }
clap = { version = "4.6.6", features = ["derive"] }
config.workspace = true
discover.workspace = true
engine.workspace = true
env_logger = { version = "0.11.11", default-features = false }
ignore = "0.4.33"
log = "0.4"
semver = "1.0.28"
surface.workspace = true
tempfile = "3.27.0"
thiserror = "2"

[lints]
workspace = true
