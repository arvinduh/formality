[package]
name = "fml"
version = "0.3.0"
edition = "2024"
authors = ["Arvin Duh"]
description = "One CLI to format, lint, and sync configs across all languages"
license = "MIT"
readme = "README.md"
repository = "https://github.com/arvinduh/formality"

[dependencies]
clap = { version = "4.6.6", features = [
  "derive",
  "color",
  "help",
  "suggestions",
  "usage",
] }
colored = "3.1.1"
comfy-table = { version = "8.0.0", features = ["custom_styling"] }
crossterm = { version = "0.29", default-features = false }
ignore = "0.4.33"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = { version = "1.2", features = ["derive"] }
similar = { version = "3.1.2", features = ["text"] }
tempfile = "3.27.0"
toml = "1.1.4"
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "sync"] }
unicode-width = "0.2"
which = "8.0.5"
serde_yaml = "0.9.34"
semver = "1.0.28"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
# Docs
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Imports
wildcard_imports = "deny"
single_component_path_imports = "allow" # `use some_crate;` manifests
# Hygiene
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
# Idioms
case_sensitive_file_extension_comparisons = "warn"
fn_params_excessive_bools = "warn"
if_not_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
must_use_candidate = "warn"
redundant_closure_for_method_calls = "warn"
# Performance
format_collect = "warn"
implicit_hasher = "warn"
redundant_clone = "warn"

# Config for 'dist' (cargo-dist): GitHub Releases are the only channel - no
# crates.io publish. See docs/release.md and issue #134.
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
# Path(s) installers place binaries in, tried in order. `~/.local/bin` first:
# the per-user bin dir most Linux distros already put on PATH, and it needs no
# Rust toolchain. (dist rejects the `CARGO_HOME` keyword when combined with
# other paths, so the cargo bin dir is spelled out literally.)
install-path = ["$HOME/.local/bin", "$HOME/.cargo/bin"]
# Whether to install an updater program (kept out of scope - see issue #121)
install-updater = false
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# GitHub already attaches source archives to every release
source-tarball = false

[profile.dist]
inherits = "release"
lto = "thin"
