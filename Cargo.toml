[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Arvin Duh"]
license = "MIT"
repository = "https://github.com/arvinduh/formality"

[workspace.dependencies]
config = { package = "fml-config", path = "crates/config" }
discover = { package = "fml-discover", path = "crates/discover" }
engine = { package = "fml-engine", path = "crates/engine" }
surface = { package = "fml-surface", path = "crates/surface" }
tool = { package = "fml-tool", path = "crates/tool" }

[package]
name = "fml"
version = "0.5.0"
description = "Formats and lints every file in a repo with the best tool for each language"
readme = "README.md"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axoupdater = { version = "0.10.2", default-features = false, features = [
  "blocking",
  "github_releases",
] }
clap = { version = "4.6.6", features = ["derive"] }
config.workspace = true
discover.workspace = true
engine.workspace = true
env_logger = { version = "0.11.11", default-features = false }
ignore = "0.4.33"
log = "0.4"
semver = "1.0.28"
surface.workspace = true
tempfile = "3.27.0"
thiserror = "2"

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Imports
wildcard_imports = "deny"
single_component_path_imports = "allow" # `use some_crate;` manifests
# Hygiene
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
missing_docs_in_private_items = "warn"
# Google: expect over unwrap, and assert messages
unwrap_used = "warn"
missing_assert_message = "warn"
# process::exit only in main; suppress with expect + reason, never allow
exit = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Performance (nursery, outside pedantic)
redundant_clone = "warn"

# Config for 'dist' (cargo-dist): GitHub Releases are the only channel - no
# crates.io publish. See docs/release.md and issue #134.
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
# Path(s) installers place binaries in, tried in order. `~/.local/bin` first:
# the per-user bin dir most Linux distros already put on PATH, and it needs no
# Rust toolchain. (dist rejects the `CARGO_HOME` keyword when combined with
# other paths, so the cargo bin dir is spelled out literally.) `~/` is the
# user's home on every OS; `$HOME/` would be an environment variable, which
# Windows does not set, so the PowerShell installer found no path (#548).
install-path = ["~/.local/bin", "~/.cargo/bin"]
# Whether to install an updater program (kept out of scope - see issue #121)
install-updater = false
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# GitHub already attaches source archives to every release
source-tarball = false

[profile.dist]
inherits = "release"
lto = "thin"
