[package]
name = "fml"
version = "0.2.0"
edition = "2024"
description = "One CLI to format, lint, and sync configs across all languages"
license = "MIT"
readme = "README.md"
repository = "https://github.com/arvinduh/formality"

[lib]
name = "fml"
path = "src/lib.rs"

[[bin]]
name = "fml"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = [
  "derive",
  "color",
  "help",
  "suggestions",
  "usage",
] }
colored = "3.1.1"
comfy-table = { version = "8.0.0", features = ["custom_styling"] }
crossterm = { version = "0.29", default-features = false }
ignore = "0.4.33"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = { version = "1.2", features = ["derive"] }
similar = { version = "3.1.2", features = ["text"] }
tempfile = "3.27.0"
toml = "1.1.4"
tower-lsp = "0.20"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-std",
  "sync",
  "macros",
] }
unicode-width = "0.2"
which = "8.0.5"
serde_yaml = "0.9.34"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test)'] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"
