[package]
name = "fml"
version = "0.2.1"
edition = "2024"
authors = ["Formality Authors"]
description = "One CLI to format, lint, and sync configs across all languages"
license = "MIT"
readme = "README.md"
repository = "https://github.com/arvinduh/formality"

[lib]
name = "fml"
path = "src/lib.rs"

[[bin]]
name = "fml"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = [
  "derive",
  "color",
  "help",
  "suggestions",
  "usage",
] }
colored = "3.1.1"
comfy-table = { version = "8.0.0", features = ["custom_styling"] }
crossterm = { version = "0.29", default-features = false }
ignore = "0.4.33"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = { version = "1.2", features = ["derive"] }
similar = { version = "3.1.2", features = ["text"] }
tempfile = "3.27.0"
toml = "1.1.4"
tower-lsp = "0.20"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-std",
  "sync",
  "macros",
] }
unicode-width = "0.2"
which = "8.0.5"
serde_yaml = "0.9.34"
semver = "1.0.28"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test)'] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

# Windows MSI installer metadata (consumed by cargo-dist via `cargo wix`).
# GUIDs are unique to this project - freshly generated, never copied.
[package.metadata.wix]
upgrade-guid = "16EA66A7-4E4F-4B2D-9EB3-BE52F4992BF8"
path-guid = "0ADA61F5-692E-40C7-8519-594697CBB30A"
license = false
eula = false

# Config for 'dist' (cargo-dist): GitHub Releases are the only channel - no
# crates.io publish. See docs/release.md and issue #134.
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program (kept out of scope - see issue #121)
install-updater = false
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# Keep archive names as `fml-<target>.tar.gz` / `.zip` so existing
# `releases/latest/download/fml-<target>...` URLs and the
# `[package.metadata.binstall]` block above stay valid.
unix-archive = ".tar.gz"
windows-archive = ".zip"

[profile.dist]
inherits = "release"
lto = "thin"
