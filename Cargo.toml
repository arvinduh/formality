[package]
name = "fml"
version = "0.1.0"
edition = "2024"
description = "One CLI to format, lint, and sync configs across all languages"
license = "MIT"
readme = "README.md"
repository = "https://github.com/arvinduh/formality"

[lib]
name = "fml"
path = "src/lib.rs"

[[bin]]
name = "fml"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = [
  "derive",
  "color",
  "help",
  "suggestions",
  "usage",
] }
colored = "3.1.1"
comfy-table = "8.0.0"
ignore = "0.4.33"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = { version = "3.1.2", features = ["text"] }
tempfile = "3.27.0"
toml = "1.1.4"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
walkdir = "2.5.0"
which = "8.0.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test)'] }
