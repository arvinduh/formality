name: PR Check

# Pre-merge gating for pull requests, split into 3 independent parallel jobs
# so a failure in one surface doesn't block feedback from the others:
#
#   1. Library Tests - clippy (all targets) + the full test suite
#      (cargo test --verbose covers unit tests, tests/version_lockstep.rs,
#      and the integration tests in tests/integration_tests.rs /
#      tests/fix_command.rs). Both exercise every surface (toml,
#      javascript, markdown, ...) via the real external tool binaries
#      (taplo, biome, markdownlint-cli2, ...) - integration_tests.rs by
#      spawning the built fml binary directly (CARGO_BIN_EXE_fml),
#      fix_command.rs by calling fml::run_with_args(...) in-process - so
#      this job already behaviorally validates that fmt/lint/sync produce
#      correct output. That's also why this job builds fml and runs
#      `fml install` before the test suite: this job's runner starts with
#      none of those tools installed, and it's a separate parallel runner
#      from Job 2, so Job 2 installing its own copies doesn't help it.
#   2. Formality Dogfooding - runs fml against THIS repo's own live tree.
#      Job 1 already proves fmt/lint *work correctly*; this job proves this
#      repo's checked-in state actually *complies* with them right now -
#      real formatting/lint violations in tracked files (e.g. an
#      unformatted Markdown code fence - the concrete failure mode #184 was
#      filed over). This repo carries no generated native config files
#      (.rustfmt.toml, .prettierrc, ...) of its own - fmt/lint resolve
#      formality.toml inline - so there's no `fml sync --check` step here;
#      config drift isn't a thing this repo's own tree can have (see #184
#      discussion / design note). This job also asserts the checked-in
#      schema/formality.schema.json has no drift from
#      what the freshly built binary generates, and that any change to it is
#      paired with a SCHEMA_VERSION bump in src/config/schema.rs (see #185).
#   3. Security Audit - cargo audit against the advisory database.
#
# "Library Tests" is the required branch-protection status check name -
# GitHub branch protection matches on job `name`, not job id, so keep that
# name exactly if this job is ever renamed or restructured, or update
# branch protection in lockstep.
on:
  pull_request:
    branches: ["main"]

concurrency:
  group: pr-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: "1"
  FORCE_COLOR: "1"

jobs:
  test-lib:
    name: Library Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        # Pinned to match rust-toolchain.toml; this action does not read
        # that file itself, so bump both together (see ci.yml). rustfmt is
        # required (not just clippy) because the integration tests below
        # spawn the real fml binary, which shells out to rustfmt for the
        # rust surface.
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build fml
        run: cargo build

      - name: Install tool dependencies via fml
        # tests/integration_tests.rs and tests/fix_command.rs spawn the
        # real built fml binary against synthetic TempDir project layouts
        # covering every surface, so the external tool binaries they shell
        # out to (taplo, biome, markdownlint-cli2, yamllint, ...) must be
        # on PATH before `cargo test --verbose` runs, mirroring Job 2 and
        # the old ci.yml. Without this, e.g. fix_command.rs's TOML-surface
        # tests fail on a clean runner with no taplo installed.
        run: ./target/debug/fml install

      - name: Run full test suite
        run: cargo test --verbose

  dogfooding:
    name: Formality Dogfooding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        # clippy is required (not just rustfmt) because `fml lint` on the
        # rust surface is `cargo clippy` - without the component, `fml
        # install`/`fml doctor` won't catch the gap either: they probe
        # clippy-driver via `which`, and rustup's shim at
        # ~/.cargo/bin/clippy-driver exists even when the component isn't
        # installed, so it false-positives as [READY].
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build fml
        run: cargo build

      - name: Install tool dependencies via fml
        run: ./target/debug/fml install

      - name: Check formatting
        run: ./target/debug/fml fmt --check

      - name: Lint surfaces
        run: ./target/debug/fml lint

      - name: Check schema drift
        # Regenerate schema/formality.schema.json from the freshly built
        # binary and assert it matches what's checked in. tests/schema_drift.rs
        # (Job 1) already asserts this in-process via generate_schema(); this
        # step is a CI-visible surface for the same invariant against this
        # repo's own committed artifact, exercising the real `fml schema` CLI
        # path rather than the library function directly (see #185). The raw
        # CLI output isn't prettier-formatted, so `fml fmt` runs on it first
        # to match how the committed file is actually produced/formatted.
        run: |
          ./target/debug/fml schema --output schema/formality.schema.json
          ./target/debug/fml fmt schema/formality.schema.json
          git diff --exit-code schema/formality.schema.json

      - name: Enforce schema version progression
        # If schema/formality.schema.json actually changed relative to main,
        # SCHEMA_VERSION in src/config/schema.rs must have INCREASED (not just
        # differed) - a schema edit without a forward version bump means
        # consumers pinning `#:schema .../s{major}.{minor}/...` can silently
        # drift onto a schema that no longer matches what they pinned, and a
        # version *decrease* would break that pinning just as badly (see
        # #185).
        #
        # The extraction below deliberately does NOT match the const
        # declaration as one literal line. rustfmt (max_width = 80, resolved
        # inline by fml from this repo's formality.toml `line_length`)
        # reformats
        # `SchemaVersion { major: 1, minor: 0 }` onto multiple lines as soon
        # as either number needs 2 digits (verified locally: `minor: 10` or
        # `major: 10` already overflow 80 cols), which would make a
        # single-line regex match nothing - silently, since this step runs
        # under `set -e` with no pipefail. Squashing whitespace first keeps
        # the same anchor text working regardless of how rustfmt wraps the
        # literal. Do not "simplify" this back to a one-line match - the
        # very next minor bump (s1.10) is enough to break it.
        #
        # `| head -n1` on each extraction is deliberate, not redundant with
        # `grep -o`: if the anchor pattern ever matches twice (e.g. a second
        # occurrence of the literal `SCHEMA_VERSION: SchemaVersion =
        # SchemaVersion { major:` text elsewhere in the squashed file), `grep
        # -o` prints every match, collapsing `$pr_major` etc. into a
        # multi-line value like `$'9\n1'`. `-m1` on grep does NOT fix this -
        # it caps matching *lines*, and the squashed source is one line - so
        # the numeric `[ ... ]` comparisons below would then throw "integer
        # expression expected" from *inside* an `if` condition, which `set
        # -e` does not abort on; the condition just evaluates false and the
        # gate silently waves the change through with a garbled message
        # instead of failing. `head -n1` collapses to the first match so the
        # numeric comparison (or the empty-match guard) behaves correctly
        # instead of failing open.
        run: |
          git fetch --depth=1 origin main

          extract_major() { tr -d ' \n' | grep -oP 'SCHEMA_VERSION:SchemaVersion=SchemaVersion\{major:\K\d+' | head -n1 || true; }
          extract_minor() { tr -d ' \n' | grep -oP 'SCHEMA_VERSION:SchemaVersion=SchemaVersion\{major:\d+,minor:\K\d+' | head -n1 || true; }

          if ! git diff --quiet origin/main -- schema/formality.schema.json; then
            main_major=$(git show origin/main:src/config/schema.rs | extract_major)
            main_minor=$(git show origin/main:src/config/schema.rs | extract_minor)
            pr_major=$(extract_major < src/config/schema.rs)
            pr_minor=$(extract_minor < src/config/schema.rs)

            if [ -z "$main_major" ] || [ -z "$main_minor" ] || [ -z "$pr_major" ] || [ -z "$pr_minor" ]; then
              echo "::error file=src/config/schema.rs::could not parse SCHEMA_VERSION from src/config/schema.rs (main: major='$main_major' minor='$main_minor', PR: major='$pr_major' minor='$pr_minor'). Has the SCHEMA_VERSION declaration been reformatted in a way the extraction pattern doesn't handle? Update the pattern in .github/workflows/pr-check.yml."
              exit 1
            fi

            if [ "$pr_major" -lt "$main_major" ] || { [ "$pr_major" -eq "$main_major" ] && [ "$pr_minor" -le "$main_minor" ]; }; then
              echo "::error file=src/config/schema.rs::schema/formality.schema.json changed relative to main, but SCHEMA_VERSION was not incremented forward (main: ${main_major}.${main_minor}, PR: ${pr_major}.${pr_minor}). Bump SCHEMA_VERSION (major or minor, strictly forward) in src/config/schema.rs alongside any schema change."
              exit 1
            fi
            echo "schema/formality.schema.json changed and SCHEMA_VERSION was incremented forward (${main_major}.${main_minor} -> ${pr_major}.${pr_minor}) - OK."
          else
            echo "schema/formality.schema.json unchanged relative to main - no version bump required."
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install prebuilt cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit
