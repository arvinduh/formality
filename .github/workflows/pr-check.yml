name: CI

# Runs on every pull request and again on main, so a main tip that two
# separately green PRs produced is still tested as a whole. Branch protection
# requires the "Library Tests" and "Formality Dogfooding" job names, so keep
# them exactly or update branch protection with them.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Library Tests
            os: ubuntu-latest
          - name: macOS Tests
            os: macos-latest
          - name: Windows Tests
            os: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        # Pinned to match rust-toolchain.toml, which this action does not
        # read, so bump both together.
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Go
        # shfmt installs with `go install`; macOS runners have no Go.
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install tools
        shell: bash
        run: .github/install-tools.sh

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  dogfooding:
    name: Formality Dogfooding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Go
        # shfmt installs with `go install`; macOS runners have no Go.
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install tools
        run: .github/install-tools.sh

      - name: Build fml
        run: cargo build

      - name: Check formatting
        run: ./target/debug/fml fmt --check

      - name: Lint
        run: ./target/debug/fml lint

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install prebuilt cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit
