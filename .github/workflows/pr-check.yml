name: PR Check

# Fast presubmit feedback for pull requests: just the library unit tests
# (including the version lockstep check in tests/version_lockstep.rs).
# This intentionally skips the full toolchain install, fmt/lint/sync
# dogfooding, and security audit that ci.yml runs on push to main, so PR
# authors get signal in well under a minute instead of waiting on 10+
# toolchains.
on:
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: "1"
  FORCE_COLOR: "1"

jobs:
  test-lib:
    name: Library Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        # Pinned to match rust-toolchain.toml; this action does not read
        # that file itself, so bump both together (see ci.yml).
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run library tests
        run: cargo test --lib

      - name: Run version lockstep check
        # Cheap integration test (no external toolchain installs), kept
        # in pr-check so version drift between Cargo.toml and the VS Code
        # extension's package.json is caught before merge.
        run: cargo test --test version_lockstep
