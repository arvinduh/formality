name: Install Regression

# Fresh-install checks for `fml doctor --install` on all three OSes. Split
# out of pr-check.yml so it runs only on PRs that touch code that can change
# how tools are installed, found, version-probed or spawned. It takes the
# longest of any PR job (Windows ~6 min) and pulls from npm, Homebrew and
# the JDK mirror on every run, so a docs-only PR gains nothing but outages
# from it. Not a required status check, so skipping it never leaves a PR
# waiting on a check that will not run.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/surfaces/**"
      - "src/engine/**"
      - "src/commands/doctor/**"
      - "src/errors.rs"
      - "src/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/install-regression.yml"

concurrency:
  group: install-regression-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: "1"
  FORCE_COLOR: "1"

jobs:
  install-regression:
    # Not currently a required branch-protection status check (only
    # "Library Tests" and "Formality Dogfooding" are) -- adding one is a call
    # for whoever owns branch protection to make deliberately, not a side
    # effect of adding this job.
    # This job exists specifically to catch a class of bug `test-lib`'s
    # ubuntu-only `fml doctor --install` step could not: a tool installed
    # within an `fml ... --install` invocation being reported ToolMissing by
    # the very next step of that *same* invocation, because a per-process
    # PATH-lookup cache (`surfaces::tooling::BINARY_CACHE`) memoized the
    # pre-install "not found" result and was never evicted after the install
    # succeeded.
    # The bug itself is platform-independent (pure in-process caching, no
    # OS-specific code path), but the concrete report that caught it was on
    # a Windows runner with none of the tools pre-cached -- exactly the kind
    # of clean-machine, first-run state this matrix reproduces on all three
    # OSes rather than relying on it to only ever repro on Windows again.
    # Also catches two more classes in the same family, where the binary
    # genuinely is not on this process's PATH rather than merely
    # mis-cached: a Scoop/winget install registering its new PATH entry in
    # the Windows registry, which an already-running process's environment
    # block never picks up on its own (see
    # `tooling::refresh_windows_path_from_registry`), and `go install`
    # writing into $GOBIN/$GOPATH/bin, which is on PATH only if the user
    # put it there -- it is not on the stock ubuntu or windows runner
    # images, so `goimports` reproduces this every run. That last one is
    # handled by resolving at *lookup* time rather than by mutating any
    # process's PATH (`tooling::resolve_via_known_install_dir`, reached from
    # `tooling::resolve_binary_path`), because a PATH mutation only ever
    # helps the process that performed the install and never the next one
    # (#293). Both halves have to hold for a tool to be usable, and this job
    # is what exercises them together: finding the binary
    # (`check_binary_exists`) *and* spawning it by the path that was found
    # (`tooling::create_tool_command`) -- resolving without spawning by that
    # path turns a "[MISS]" into a "Failed to execute", which is worse, not
    # better. Also exercises the cargo-binstall auto-bootstrap path
    # (typstyle has no native package on any OS -- see
    # `tooling::ensure_cargo_binstall`).
    name: Fresh-Install Regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Set up Rust cache
        # cache-bin: false is what makes "fresh install" true. The default
        # (true) also caches ~/.cargo/bin, which persists every tool a
        # previous run of this job installed with cargo/cargo-binstall
        # (typstyle, taplo, ...) into the next run -- so those tools were
        # already on PATH before `fml doctor --install` ran and their install
        # chains, including the cargo-binstall bootstrap this job is meant
        # to exercise, were never entered at all. The workspace target
        # cache (what actually makes this job fast) is unaffected.
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Set up a JDK google-java-format can run on
        # google-java-format 1.29+ requires JDK 21; the stock ubuntu runner
        # image still defaults to JDK 17, on which the formatter dies with a
        # NoClassDefFoundError for an internal javac class. That is a
        # property of the runner image, not of fml's install chain -- but it
        # left the java surface permanently [FAIL] in this job's output,
        # which is exactly the kind of standing red that trains people to
        # stop reading it. (fml itself now explains that failure instead of
        # dumping the raw stack trace; see `explain_jvm_incompatibility` in
        # surfaces/java.rs.)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build fml
        run: cargo build

      - name: Scaffold a synthetic project covering every registered surface
        # One file per surface in surfaces::registry::default_registry() (12
        # total, kept in sync by hand -- see the Rust unit test in this repo
        # that also enumerates them), in a scratch dir outside the checkout
        # so it can't collide with this repo's own formality.toml / dogfood
        # state. Exercises every tool's install chain on all three OSes, not
        # just the handful the original report happened to touch.
        #
        # Sample.java and Sample.kt are PascalCase because their own
        # toolchains require it: ktlint's standard:filename rule fails a
        # lowercase .kt outright (a violation that says nothing about
        # installs, which is all this job is here to test).
        #
        # go.mod is what lets `fml lint` reach golangci-lint at all: without
        # one the go surface reports an ExecutionError before spawning
        # anything, so the tool would install and still never run. The Go
        # file sits in its own package directory because golangci-lint
        # typechecks a package, and a package directory holding sample.cpp
        # fails with "C++ source files not allowed when not using cgo".
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/fml-install-regress"
          cd "$RUNNER_TEMP/fml-install-regress"
          {
            echo '[global]'
            echo 'indent_size = 2'
            echo 'line_length = 80'
            echo 'end_of_line = "lf"'
            echo 'charset = "utf-8"'
            echo 'insert_final_newline = true'
            echo 'trim_trailing_whitespace = true'
          } > formality.toml
          printf 'fn main() {}\n' > sample.rs
          printf 'x = 1\n' > sample.py
          printf 'int main() { return 0; }\n' > sample.cpp
          printf 'public class Sample {\n  public static void main(String[] args) {}\n}\n' > Sample.java
          printf 'module example.com/sample\n\ngo 1.21\n' > go.mod
          mkdir -p hello
          printf 'package main\n\nfunc main() {}\n' > hello/main.go
          printf '# Title\n\nSome text.\n' > sample.md
          printf 'key: value\n' > sample.yaml
          printf '{}\n' > sample.json
          printf 'key = "value"\n' > sample.toml
          printf '= Heading\n\nSome text.\n' > sample.typ
          printf 'const x = 1;\n' > sample.js
          printf 'fun main() {}\n' > Sample.kt

      - name: fml doctor --install then fml fmt and fml lint on a runner with none of the tools pre-cached
        # `fml lint` runs after `fml fmt`, under the same PATH and into the
        # same log, because `fml fmt` runs formatters only: a lint-only tool
        # (checkstyle, golangci-lint, yamllint, clang-tidy) would otherwise
        # install, pass the PATH lookup and never be spawned, so none of the
        # signatures below could fire for it. A lint finding on a sample
        # file is not an install regression and matches no signature, so it
        # does not fail this step.
        #
        # Deliberately does NOT gate on fml's own exit code: a tool that
        # installs but doesn't land on its exact pinned version (a stale
        # Homebrew bottle, an npm registry lag, ...) is a real but separate
        # concern the existing convergence guard already surfaces as a
        # [WARN] and a non-clean exit -- unrelated to, and much flakier
        # than, the two things this job exists to catch (both below).
        #
        # Failure signature 1: `[MISS] <lang> Missing binary: <tool>` for a
        # tool that has its own `[OK] Successfully installed <tool>` line
        # earlier in the same output -- the in-process BINARY_CACHE
        # staleness bug this job was written for, and the $GOBIN/$GOPATH/bin
        # gap now closed by lookup-time resolution
        # (`tooling::resolve_via_known_install_dir`). Scoped to exactly
        # that intersection on purpose: a tool fml never claimed to install
        # (no chain available on this runner) reporting [MISS] is a runner
        # image gap, not a regression, and is reported as a notice instead.
        #
        # Failure signature 2: `Failed to execute <tool>` for a tool that
        # has its own `[OK] Successfully installed <tool>` line earlier in
        # the same output -- the *other* shape of "installed, then
        # unusable". Signature 1 fires when the tool cannot be found;
        # this one fires when it is found and then cannot be run, which is
        # what happens if resolution reaches the existence check but not
        # the spawn (#293). That regression once passed this job while
        # breaking Go formatting outright, because the guard only watched
        # signature 1. On Windows it also covers a `cmd /C` npm shim whose
        # target cannot launch: `cmd` exits 1 there, which once read as
        # `[FAIL] kotlin Violations found` and passed this job while
        # ktlint never ran (#402); fml now reports that shape as
        # `Failed to execute <tool>` too.
        #
        # Scoped to the same just-installed intersection as signature 1, and
        # deliberately NOT a bare `[ERR]` grep: an [ERR] names a surface,
        # not a tool, so a blanket match would fail on unrelated breakage
        # (a genuinely bad sample file, a tool crashing on a runner quirk)
        # and the guard would get switched off by the first person it
        # annoys -- worse than the gap it closes. `Failed to execute <tool>`
        # is the one execution-error spelling that names the binary, so it
        # is the one that can be attributed to something fml just installed.
        #
        # Failure signature 3: a convergence-guard [WARN] whose detail says
        # "reports an unparseable version" specifically (as opposed to
        # "reports X, expected Y" with two real version numbers, which is
        # just an upstream package manager lagging the pin -- tolerated).
        # "unparseable" fires when the post-install version probe couldn't
        # resolve/run the binary *at all*, not just parse unexpected output
        # -- e.g. Scoop/winget on Windows registering the new PATH entry in
        # the registry, which an already-running process's environment
        # block never picks up on its own.
        shell: bash
        env:
          # This step parses tool names out of fml's own output, so it needs
          # that output plain: the workflow-level CLICOLOR_FORCE/FORCE_COLOR
          # (plus GITHUB_ACTIONS, which fml also treats as force-color) wrap
          # every tool name in SGR escapes, and the extractions below would
          # then capture escape bytes instead of a name -- matching nothing
          # and passing the job no matter what fml actually reported.
          # NO_COLOR takes precedence over all three (see
          # `ui::no_color_requested`).
          NO_COLOR: "1"
        run: |
          set +o pipefail
          cd "$RUNNER_TEMP/fml-install-regress"
          # Unset PIPX_BIN_DIR so pipx installs into its stock default ~/.local/bin
          # rather than the runner-image /opt/pipx_bin pre-configuration.
          unset PIPX_BIN_DIR
          fml_bin="$GITHUB_WORKSPACE/target/debug/fml"
          if [ "$RUNNER_OS" = "Windows" ]; then
            fml_bin="$GITHUB_WORKSPACE/target/debug/fml.exe"
          fi
          "$fml_bin" doctor --install > fml-output.log 2>&1 || true
          fmt_path="$PATH"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Strip $HOME/.local/bin from PATH for the post-install fml invocation
            # so CI exercises off-PATH resolution for pipx/uv/pip (PR #310, #312).
            case ":$PATH:" in
              *":$HOME/.local/bin:"*|*":$HOME/.local/bin/:"*)
                echo "Confirmed: $HOME/.local/bin is present on runner PATH"
                ;;
            esac
            clean_path=""
            IFS=: read -ra parts <<< "$PATH"
            for p in "${parts[@]}"; do
              if [ "$p" != "$HOME/.local/bin" ] && [ "$p" != "$HOME/.local/bin/" ] && [ "$p" != "/opt/pipx_bin" ] && [ "$p" != "/opt/pipx_bin/" ]; then
                clean_path="${clean_path:+${clean_path}:}$p"
              fi
            done
            fmt_path="$clean_path"
          fi
          PATH="$fmt_path" "$fml_bin" fmt >> fml-output.log 2>&1 || true
          PATH="$fmt_path" "$fml_bin" lint >> fml-output.log 2>&1 || true
          cat fml-output.log

          # Only a [MISS] for a tool fml *itself just installed in this same
          # invocation* is the regression described above. A bare
          # `grep -q '[MISS]'` also fires for a tool this runner has no
          # install chain for at all -- on macOS images that ship no Go,
          # `gofmt`/`goimports` (fml deliberately installs formatters, not
          # whole language toolchains) -- which is a gap in the runner
          # image, not a bug in fml, and made this job unpassable on macOS
          # for a reason no change to this repo could fix.
          installed=$(sed -n 's/.*Successfully installed \([^ ]*\).*/\1/p' fml-output.log | sort -u)
          missing=$(sed -n 's/.*Missing binary: \([^ ]*\).*/\1/p' fml-output.log | sort -u)
          nonempty() { printf '%s\n' "$1" | sed '/^$/d'; }
          regressed=$(comm -12 <(nonempty "$installed") <(nonempty "$missing"))

          if [ -n "$regressed" ]; then
            echo "::error::fml reported as [MISS] tools it had just installed within the same invocation: $(nonempty "$regressed" | tr '\n' ' ')-- see the log above. This is the exact regression this job exists to catch."
            exit 1
          fi
          # The other half of "installed, then unusable": fml found the tool
          # (so no [MISS]) and then could not run it. Attributed per-tool by
          # the binary name in `Failed to execute <tool>: ...`, then
          # intersected with what this same invocation installed, exactly
          # like the [MISS] check above -- an execution failure for a tool
          # fml never installed here is not this regression.
          unrunnable=$(sed -n 's/.*Failed to execute \([^ :]*\).*/\1/p' fml-output.log | sort -u)
          broken=$(comm -12 <(nonempty "$installed") <(nonempty "$unrunnable"))

          if [ -n "$broken" ]; then
            echo "::error::fml failed to execute tools it had just installed within the same invocation: $(nonempty "$broken" | tr '\n' ' ')-- see the log above. Finding a binary without being able to spawn it is the same install-then-unusable regression as a [MISS], only spelled differently."
            exit 1
          fi
          if grep -q 'unparseable version' fml-output.log; then
            echo "::error::fml could not resolve/run a tool it just installed (reported 'an unparseable version', meaning the post-install probe found nothing to run at all, not just unexpected --version output) -- see the log above."
            exit 1
          fi

          uninstallable=$(nonempty "$missing" | grep -vxF -f <(nonempty "$installed") || true)
          if [ -n "$uninstallable" ]; then
            echo "::notice::Tolerated: fml never reported installing these on $RUNNER_OS, so their absence is a runner-image gap rather than the install-then-miss regression this job guards: $(nonempty "$uninstallable" | tr '\n' ' ')"
          fi
          echo "No just-installed tool reported as missing, none that failed to execute, and no unresolvable just-installed tool -- regression check passed."
