name: CI

# Full toolchain integration suite: fmt/lint/sync dogfooding, the full test
# suite, and a security audit. Runs only on push to main, since it installs
# 10+ toolchains and is too slow for per-PR feedback. Fast PR-time checks
# live in pr-check.yml instead.
on:
  push:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: "1"
  FORCE_COLOR: "1"

jobs:
  check-and-test:
    name: Format, Lint & Test (Dogfooding fml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        # Pinned to match rust-toolchain.toml; this action does not read
        # that file itself, so bump both together.
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build fml
        run: cargo build

      - name: Install tool dependencies via fml
        run: ./target/debug/fml install

      - name: Verify Config Sync
        run: ./target/debug/fml sync --check

      - name: Check Formatting
        run: ./target/debug/fml fmt --check

      - name: Lint Surfaces
        run: ./target/debug/fml lint

      - name: Run Test Suite
        run: cargo test --verbose

  security-audit:
    name: Security Audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install prebuilt cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit
