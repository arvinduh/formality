name: CI

# Runs on every pull request and again on main, so a main tip that two
# separately green PRs produced is still tested as a whole. Pushes to main
# also test macOS. Branch protection requires the "Tests (ubuntu-latest)"
# and "Tests (windows-latest)" job names.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        # Reads rust-toolchain.toml.
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v6
        # shfmt installs with `go install`; macOS runners have no Go.
        with:
          go-version: stable
          cache: false

      - name: Install tools
        shell: bash
        run: .github/install-tools.sh

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace --no-fail-fast
